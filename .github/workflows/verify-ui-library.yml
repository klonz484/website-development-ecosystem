name: Verify UI library

on:
  pull_request:
    paths:
      - "toolkit/ui-library/**"
      - ".github/workflows/verify-ui-library.yml"
  push:
    branches: [main]
    paths:
      - "toolkit/ui-library/**"
      - ".github/workflows/verify-ui-library.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolkit/ui-library
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
