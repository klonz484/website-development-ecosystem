name: Verify UI library

on:
  pull_request:
    paths:
      - "toolkit/ui-library/**"
      - ".github/workflows/verify-ui-library.yml"
  push:
    branches: [main]
    paths:
      - "toolkit/ui-library/**"
      - ".github/workflows/verify-ui-library.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolkit/ui-library
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Generate package lockfile from declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit synchronized package lockfile to this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- toolkit/ui-library/package-lock.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolkit/ui-library/package-lock.json
          git commit -m "chore(ui): synchronize npm lockfile"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
