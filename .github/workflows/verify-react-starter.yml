name: Verify React starter template

on:
  pull_request:
    paths:
      - "toolkit/react-vite-starter/**"
      - ".github/workflows/verify-react-starter.yml"
  push:
    branches: [main]
    paths:
      - "toolkit/react-vite-starter/**"
      - ".github/workflows/verify-react-starter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolkit/react-vite-starter
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run dev -- --host 127.0.0.1 > /tmp/starter-vite.log 2>&1 &
      - run: npx playwright test
