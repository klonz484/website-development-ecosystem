name: Synchronize UI library lockfile

on:
  push:
    branches:
      - feat/accessible-component-library
    paths:
      - "toolkit/ui-library/package.json"
      - "toolkit/ui-library/package-lock.json"
      - ".github/workflows/sync-ui-lockfile.yml"

permissions:
  contents: write

concurrency:
  group: ui-library-lockfile-sync
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: toolkit/ui-library
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/accessible-component-library
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible install and package
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Commit synchronized lockfile
        working-directory: .
        run: |
          if git diff --quiet -- toolkit/ui-library/package-lock.json; then
            echo "UI library lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolkit/ui-library/package-lock.json
          git commit -m "chore(ui): add synchronized npm lockfile"
          git push origin HEAD:feat/accessible-component-library
