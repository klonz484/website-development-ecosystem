name: Publish UI library to npm

on:
  push:
    tags:
      - "ui-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: toolkit/ui-library
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install npm version supporting OIDC trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Install exact dependencies
        run: npm ci
      - name: Verify package
        run: |
          npm run typecheck
          npm test
          npm run build
          npm pack --dry-run
      - name: Validate release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ui-v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
      - name: Publish with npm trusted publishing (OIDC)
        run: npm publish --access public
